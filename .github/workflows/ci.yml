name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
      - name: Install frontend dev dependencies
        run: npm ci --ignore-scripts
      - name: Ruff format check
        run: .venv/bin/ruff format --check app run.py tests tools
      - name: Ruff lint
        run: .venv/bin/ruff check app run.py tests tools
      - name: Pyright
        run: .venv/bin/pyright --project pyrightconfig.json
      - name: ESLint
        run: npm run lint
      - name: JavaScript tests
        run: npm run test:js
      - name: Offline pytest (unit + contract)
        run: .venv/bin/python -m pytest -m "not e2e and not integration" -q

  integration:
    name: PostgreSQL integration and coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thua2_main_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d thua2_main_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thua2_main_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
      - name: Backend tests with coverage
        run: .venv/bin/python -m pytest -m "not e2e" --cov=app --cov-config=pyproject.toml --cov-branch --cov-report=json:artifacts/coverage-full-final.json --junitxml=artifacts/tests-ci.xml -q
      - name: Coverage gate
        run: .venv/bin/python tools/check_coverage.py
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: |
            artifacts/tests-ci.xml
            artifacts/coverage-full-final.json
          if-no-files-found: warn

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thua2_main_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d thua2_main_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thua2_main_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
      - name: Install Playwright Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Browser E2E
        run: .venv/bin/python -m pytest -m e2e --timeout=90 -q
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: warn

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t thua2-main:ci .
