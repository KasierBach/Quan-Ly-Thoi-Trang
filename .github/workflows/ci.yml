name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version for backend and browser tests
        type: choice
        default: '3.11'
        options:
          - '3.11'
          - '3.14'
      postgresql_version:
        description: PostgreSQL version for integration and browser tests
        type: choice
        default: '15'
        options:
          - '15'
          - '18'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISABLE_DOTENV: '1'
      TEST_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version || '3.11' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
      - name: Install frontend dev dependencies
        run: npm ci --ignore-scripts
      - name: Audit hash-locked Python runtime dependencies
        timeout-minutes: 3
        run: .venv/bin/python -m pip_audit --strict --require-hashes --disable-pip -r requirements.txt --progress-spinner off
      - name: Audit hash-locked Python dev dependencies
        timeout-minutes: 3
        run: .venv/bin/python -m pip_audit --strict --require-hashes --disable-pip -r requirements-dev.txt --progress-spinner off
      - name: Audit installed frontend dependencies (including dev)
        timeout-minutes: 2
        run: npm audit --include=dev
      # Only HIGH severity fails CI. MEDIUM findings require manual review;
      # retain docs/SECURITY_REVIEW.md and the raw scan, with no ignore/baseline filters.
      - name: Bandit HIGH severity gate
        run: |
          mkdir -p artifacts
          .venv/bin/python -m bandit -r app run.py -lll -f json -o artifacts/bandit-high-ci.json
      - name: Retain unfiltered Bandit report for manual MEDIUM review
        if: ${{ always() && !cancelled() }}
        run: |
          mkdir -p artifacts
          .venv/bin/python -m bandit -r app run.py --exit-zero -f json -o artifacts/bandit-review-ci.json
      - name: Upload Bandit evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-artifacts
          path: artifacts/bandit-*-ci.json
          if-no-files-found: warn
      - name: Ruff format check
        run: .venv/bin/ruff format --check app run.py tests tools
      - name: Ruff lint
        run: .venv/bin/ruff check app run.py tests tools
      - name: Pyright
        run: .venv/bin/pyright --project pyrightconfig.json
      - name: ESLint
        run: npm run lint
      - name: JavaScript tests
        run: npm run test:js
      - name: Offline pytest (unit + contract)
        run: .venv/bin/python -m pytest -m "not e2e and not integration" -q

  integration:
    name: PostgreSQL integration and coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:${{ inputs.postgresql_version || '15' }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thua2_main_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d thua2_main_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thua2_main_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version || '3.11' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
      - name: Backend tests with coverage
        run: .venv/bin/python -m pytest -m "not e2e" --cov=app --cov-config=pyproject.toml --cov-branch --cov-report=json:artifacts/coverage-full-final.json --junitxml=artifacts/tests-ci.xml -q
      - name: Coverage gate (unchanged 90% lines / 85% branches)
        run: .venv/bin/python tools/check_coverage.py --report artifacts/coverage-full-final.json --line-threshold 90 --branch-threshold 85
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-artifacts
          path: |
            artifacts/tests-ci.xml
            artifacts/coverage-full-final.json
          if-no-files-found: warn

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:${{ inputs.postgresql_version || '15' }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thua2_main_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d thua2_main_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thua2_main_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version || '3.11' }}
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
      - name: Install Playwright Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Browser E2E
        run: .venv/bin/python -m pytest -m e2e --timeout=90 -q
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: warn

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t thua2-main:ci .
