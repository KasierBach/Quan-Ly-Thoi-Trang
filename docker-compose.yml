services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-thua2_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/bootstrap.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-4010}:4000"
    environment:
      APP_ENV: development
      DISABLE_DOTENV: "1"
      SECRET_KEY: ${SECRET_KEY:?Set an independent SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-thua2_db}
      TRUSTED_HOSTS: localhost,127.0.0.1
      MAIL_SUPPRESS_SEND: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/instance/uploads

volumes:
  postgres_data:
  uploads:
