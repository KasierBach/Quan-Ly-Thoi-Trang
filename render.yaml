services:
  - type: web
    name: quan-ly-thoi-trang
    env: python
    plan: free
    buildCommand: pip install --require-hashes -r requirements.txt
    startCommand: gunicorn -k gthread --workers 1 --threads 16 --timeout 60 run:app
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DISABLE_DOTENV
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: MAIL_SUPPRESS_SEND
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.15"
