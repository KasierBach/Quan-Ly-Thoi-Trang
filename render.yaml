services:
  - type: web
    name: quan-ly-thoi-trang
    env: python
    plan: starter
    buildCommand: pip install --require-hashes -r requirements.txt
    preDeployCommand: python -m tools.migrate_db
    startCommand: gunicorn -k gthread --workers 1 --threads 16 --timeout 120 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /health/ready
    disk:
      name: uploads
      mountPath: /var/data/thua2-uploads
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DISABLE_DOTENV
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_ROOT
        value: /var/data/thua2-uploads
      - key: SECRET_KEY
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: MAIL_SUPPRESS_SEND
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.18"
