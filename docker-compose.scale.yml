# Standalone LOCAL test topology. Never merge this with docker-compose.yml.
name: thua2-scale-test

x-web: &web
  build: .
  command: [gunicorn, --worker-class, gthread, --workers, "1", --threads, "16", --bind, "0.0.0.0:4000", --timeout, "60", "run:app"]
  read_only: true
  tmpfs:
    - /tmp
  environment:
    APP_ENV: testing
    DISABLE_DOTENV: "1"
    SECRET_KEY: ${SCALE_SECRET_KEY:?Set an independent local-only SCALE_SECRET_KEY of at least 32 characters}
    DATABASE_URL: postgresql://postgres:${SCALE_POSTGRES_PASSWORD:?Set a local-only URL-safe SCALE_POSTGRES_PASSWORD}@postgres-test:5432/thua2_main_test
    RATELIMIT_STORAGE_URI: redis://redis:6379/0
    SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/1
    TRUSTED_PROXY_COUNT: "1"
    TRUSTED_HOSTS: localhost,127.0.0.1
    PUBLIC_BASE_URL: http://127.0.0.1:4011
    MAIL_SUPPRESS_SEND: "true"
    MAIL_SERVER: localhost
    MAIL_USERNAME: ""
    MAIL_PASSWORD: ""
    PIXABAY_API_KEY: ""
    OAUTH_ENABLED: "false"
    OAUTH_GOOGLE_CLIENT_ID: ""
    OAUTH_GOOGLE_CLIENT_SECRET: ""
    OAUTH_GITHUB_CLIENT_ID: ""
    OAUTH_GITHUB_CLIENT_SECRET: ""
    GEOCODE_ENABLED: "false"
    GEOCODE_NETWORK_ENABLED: "false"
    GEOCODE_ALLOW_PUBLIC_ADDRESS_QUERIES: "false"
  depends_on:
    postgres-test:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - scale_uploads:/app/instance/uploads
  networks: [backplane]

services:
  postgres-test:
    image: postgres:15.20-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SCALE_POSTGRES_PASSWORD:?Set a local-only URL-safe SCALE_POSTGRES_PASSWORD}
      POSTGRES_DB: thua2_main_test
    # Internal-only disposable database. Seed through `docker compose exec`;
    # an internal Docker network intentionally has no host-published DB port.
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/bootstrap.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d thua2_main_test"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [backplane]

  redis:
    image: redis:7.4.12-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    read_only: true
    tmpfs: [/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backplane]

  web1:
    <<: *web
  web2:
    <<: *web

  proxy:
    image: nginx:1.30.8-alpine
    ports: ["127.0.0.1:4011:80"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    volumes:
      - ./tools/nginx.scale.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
    networks: [ingress, backplane]

volumes:
  scale_uploads:

networks:
  ingress:
  backplane:
    internal: true
