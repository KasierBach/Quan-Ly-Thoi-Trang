# Local-only diagnostic proxy. ip_hash is connection affinity, NOT call affinity.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream scale_workers {
    ip_hash;
    server web1:4000;
    server web2:4000;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    client_max_body_size 5m;

    # Local diagnostic only: makes a one-worker sticky run visible in CSV context.
    add_header X-Scale-Worker $upstream_addr always;

    location / {
        proxy_pass http://scale_workers;
        proxy_set_header Host $http_host;
        # Exactly one trusted proxy; do not retain an untrusted incoming XFF chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /socket.io {
        proxy_pass http://scale_workers;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
