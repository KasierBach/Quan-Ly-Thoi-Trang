<!-- Chat Widget -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/chat-widget.css') }}">

<div class="chat-window" id="chatWindow">
    <div class="chat-header">
        <h5><i class="fas fa-headset"></i> Hỗ trợ trực tuyến</h5>
        <button type="button" class="chat-close" id="chatClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="chat-body" id="chatBody">
        <div class="message admin">
            Chào bạn! Shop có thể giúp gì cho bạn hôm nay?
            <div class="message-time">Vừa xong</div>
        </div>
    </div>
    <div class="chat-footer">
        <input type="text" class="chat-input" id="chatInput" placeholder="Nhập tin nhắn..." maxlength="4000" disabled>
        <button type="button" class="chat-send" id="chatSend" disabled><i class="fas fa-paper-plane"></i></button>
    </div>
</div>
<script type="application/json" id="chatWidgetConfig">{{ {'authenticated': session.get('user_id') is not none} | tojson }}</script>
<script type="module" src="{{ url_for('static', filename='js/chat/core/ChatWidget.js') }}"></script>
